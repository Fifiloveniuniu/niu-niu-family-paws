# Same cloud project and existing builder, separate development image/service.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, apps/api/Dockerfile, -t, 'us-west1-docker.pkg.dev/niu-niu-family-paws/family-paws/api-dev:${_REVISION}', .]
images:
  - 'us-west1-docker.pkg.dev/niu-niu-family-paws/family-paws/api-dev:${_REVISION}'
serviceAccount: projects/niu-niu-family-paws/serviceAccounts/family-paws-build@niu-niu-family-paws.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 600s
