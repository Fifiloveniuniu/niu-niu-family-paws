<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Family Paws · Chapter window study</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f2;color:#2b4f3d;font:16px system-ui}main{position:relative;height:100svh;overflow:hidden;padding:9vw;isolation:isolate}#window{position:absolute;width:250vmax;height:250vmax;left:75%;top:25%;border-radius:50%;transform:translate(-50%,-50%) scale(0);z-index:-1;background:#e7eddf}h1{font:clamp(40px,7vw,100px)/1.05 Georgia;max-width:680px}button{border:1px solid #2b4f3d;border-radius:30px;padding:12px 20px;background:transparent;color:inherit;margin:6px}#flower{position:absolute;right:20%;top:18%;font-size:120px;color:#c98b68}small{letter-spacing:.18em}p{max-width:450px;line-height:1.8}</style><main><div id="window"></div><span id="flower">✿</span><small>LOCAL DESIGN EXPERIMENT</small><h1>A little window.<br>A whole new chapter.</h1><p>A flower opens a circular view into the next scene. The petals remain the same travelling object while the surrounding landscape changes.</p><button id="next">Open the next scene →</button><button id="reverse">Reverse ←</button></main><script type="module">import {easeOutExpo} from '/apps/web/src/marketing-easing.ts';let running=0;function play(reverse=false){cancelAnimationFrame(running);const start=performance.now();function frame(now){const t=Math.min(1,(now-start)/1000),p=reverse?1-easeOutExpo(t):easeOutExpo(t);document.querySelector('#window').style.transform=`translate(-50%,-50%) scale(${p})`;document.querySelector('#flower').style.transform=`rotate(${p*60}deg) scale(${1+p*.25})`;if(t<1)running=requestAnimationFrame(frame);}running=requestAnimationFrame(frame);}document.querySelector('#next').onclick=()=>play();document.querySelector('#reverse').onclick=()=>play(true);</script></html>
